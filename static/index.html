<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI Bid Cost Analyzer</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.ico">
</head>
<body>
    <header>
        <h1>AI Bid Cost Analyzer</h1>
        <p>投标成本测算 AI 工具 - Web UI Prototype</p>
        <p>澎瑞建设 - 专用投标辅助工具</p>
    </header>

    <main>
        <section class="card">
            <h2>1. 导入记录查看</h2>
            <button onclick="loadImportRecords()">載入 import records</button>
        </section>

        <section class="stats">
            <div class="filter-panel">
                <input
                    type="text"
                    id="search-keyword"
                    placeholder="搜索項目名稱或分類..."
                >

                <select id="status-filter">

                    <option value="">
                        全部状态
                    </option>

                    <option value="pending">
                        Pending
                    </option>

                    <option value="approved">
                        Approved
                    </option>

                    <option value="rejected">
                        Rejected
                    </option>

                </select>

                <button onclick="applyFilters()">
                    Search
                </button>

            </div>
            <div class="stat-card">
                <div class="stat-title">Total</div>
                <div id="total-count" class="stat-number">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">Pending</div>
                <div id="pending-count" class="stat-number">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">Approved</div>
                <div id="approved-count" class="stat-number">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">Synced</div>
                <div id="synced-count" class="stat-number">0</div>
            </div>
        </section>
        </div>

        <section class="card">
            <h2>2. 数据表格</h2>
            <table>
                <thead>
                    <tr>
                        <th>
                            <input
                                type="checkbox"
                                id="select-all"
                            >
                        </th>
                        <th>ID</th>
                        <th>状态</th>
                        <th>项目名称</th>
                        <th>分类</th>
                        <th>清单名称</th>
                        <th>工程量</th>
                        <th>综合单价</th>
                        <th>合价</th>
                        <th>查看详情</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="records-body"></tbody>
            </table>
            <div id="feature-modal" class="modal">
                <div class="modal-content">
                    <h3>Feature Detail</h3>
                    <div class="modal-row">
                        <strong>Item Name:</strong>
                        <span id="modal-item-name"></span>
                    </div>
                    <div class="modal-row">
                        <strong>Item Code:</strong>
                        <span id="modal-item-code"></span>
                    </div>
                    <div class="modal-row">
                        <strong>Feature:</strong>
                        <pre id="modal-feature-text"></pre>
                    </div>
                    <button onclick="closeFeatureModal()">
                        Close
                    </button>
                </div>

            </div>


        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>

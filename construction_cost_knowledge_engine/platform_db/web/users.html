<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Platform users</title><link rel="stylesheet" href="/platform-static/platform.css"></head>
<body>
  <header class="topbar"><div class="brand">AI Construction System</div><nav><a href="/platform-account">Account</a><a href="/platform-admin/users" aria-current="page">Users</a></nav><div class="spacer"></div><span class="identity" data-identity></span></header>
  <main class="page"><div class="page-heading"><div><h1>User administration</h1><p class="muted">Tenant users, account status, password reset, and role assignment.</p></div></div><div id="pageStatus" class="status" role="status"></div>
    <section class="panel"><h2>Create user</h2><form id="createForm" class="form-grid"><div class="field"><label>Username<input name="username" maxlength="128" required></label></div><div class="field"><label>Display name<input name="display_name" maxlength="255" required></label></div><div class="field"><label>Email<input name="email" type="email" maxlength="320"></label></div><div class="field"><label>Initial password<input name="initial_password" type="password" minlength="12" autocomplete="new-password" required></label></div><div class="field full"><div class="actions"><button class="button" type="submit">Create user</button></div><div id="createStatus" class="status" role="status"></div></div></form></section>
    <section class="panel flush"><div class="panel-header"><h2>Users</h2></div><div class="table-wrap"><table><thead><tr><th>Username</th><th>Display name</th><th>Roles</th><th>Status</th><th>Last sign-in</th><th>Actions</th></tr></thead><tbody id="usersBody"></tbody></table></div></section>
  </main>
  <dialog id="editDialog"><div class="dialog-head"><h2>Edit user</h2><button class="button secondary small" type="button" data-close-dialog>Close</button></div><div class="dialog-body"><form class="form-grid"><div class="field full"><label>Display name<input name="display_name" maxlength="255" required></label></div><div class="field full"><label>Email<input name="email" type="email" maxlength="320"></label></div><div class="field full"><div class="actions"><button class="button" type="submit">Update</button></div></div></form></div></dialog>
  <dialog id="resetDialog"><div class="dialog-head"><h2>Reset password</h2><button class="button secondary small" type="button" data-close-dialog>Close</button></div><div class="dialog-body"><form><div class="field"><label>Temporary password<input name="new_password" type="password" minlength="12" autocomplete="new-password" required></label></div><div class="actions"><button class="button danger" type="submit">Reset password</button></div></form></div></dialog>
  <dialog id="roleDialog"><div class="dialog-head"><h2>Assign roles</h2><button class="button secondary small" type="button" data-close-dialog>Close</button></div><div class="dialog-body"><form><div id="roleOptions" class="role-options"></div><div class="actions"><button class="button" type="submit">Apply roles</button></div></form></div></dialog>
  <script type="module" src="/platform-static/users.js"></script>
</body></html>

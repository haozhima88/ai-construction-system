<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>修改初始密码</title><link rel="stylesheet" href="/platform-static/platform.css"></head>
<body class="login-shell">
  <header class="topbar"><div class="brand">AI Construction System</div><div class="spacer"></div><span class="identity">首次登录安全设置</span></header>
  <main class="login-main">
    <section class="login-panel" aria-labelledby="changePasswordTitle">
      <h1 id="changePasswordTitle">修改初始密码</h1><p class="muted">完成后将直接进入审核工作台。</p>
      <form id="changePasswordForm" autocomplete="on">
        <div class="field"><label for="currentPassword">当前密码</label><input id="currentPassword" name="current_password" type="password" autocomplete="current-password" required autofocus></div>
        <div class="field"><label for="newPassword">新密码</label><input id="newPassword" name="new_password" type="password" autocomplete="new-password" minlength="12" required></div>
        <button class="button" type="submit">修改并进入工作台</button>
      </form>
      <div id="changePasswordStatus" class="status" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script type="module" src="/platform-static/change-password.js"></script>
</body></html>
